name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Shop.slnx --configuration Release

      - name: Test
        run: dotnet test Shop.slnx --configuration Release --no-build

  leak-check:
    name: No internal references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scan for organisation-specific references
        shell: pwsh
        run: ./tools/Test-NoInternalReferences.ps1
        env:
          # Names that must never be published live in a secret, not in the repository.
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check relative links and anchors
        shell: pwsh
        run: ./tools/Test-DocumentationLinks.ps1
